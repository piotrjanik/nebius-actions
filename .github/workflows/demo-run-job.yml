# Demo: train-to-serve — the split Job path running a real LoRA fine-tune with
# Axolotl on a Nebius GPU, then deploying a STOCK vLLM image that mounts the
# resulting adapter straight from the bucket the training job already writes
# to. No image is built or pushed.
#
# Adapted from the Nebius serverless-ai-cookbook:
#   https://github.com/nebius/serverless-ai-cookbook/tree/main/training/axolotl-finetuning
#
# The pipeline is split across five jobs:
#
#   submit  (Submit Training Job) - provisions the bucket, uploads the config
#                                   and the training script, and CREATES the
#                                   Job (returns as soon as it is accepted;
#                                   does not wait).
#   wait    (Wait)                - streams the Job's logs and polls it to a
#                                   terminal state; fails if the Job did not
#                                   succeed.
#   deploy  (Deploy)              - deploys a stock vLLM image with the run
#                                   bucket mounted read-only at /adapters, and
#                                   polls the Endpoint to serving.
#   try     (Try)                 - smoke-tests /health and /v1/completions
#                                   through the LoRA adapter, and reports.
#   cleanup (Cleanup)             - tears down the endpoint, then the bucket
#                                   (in that order: the endpoint mounts the
#                                   bucket, so reversing the order would yank
#                                   storage out from under a live endpoint).
#
# Each job runs on a fresh runner, so checkout + `setup` + `auth` are repeated
# in every job that talks to Nebius: the workspace, the installed CLI and the
# minted NEBIUS_IAM_TOKEN do not survive a job boundary. State that must cross
# a boundary (bucket, job id, endpoint) is published through job `outputs`.
#
# Cleanup is its own job with `needs` on all four and `if: always()`, so the
# paid endpoint and the bucket are torn down even when an upstream job fails or
# the run is cancelled. Folding teardown into `try` would leak the endpoint
# whenever `deploy` failed, because `try` would then never run.
#
# It QLoRA-fine-tunes Qwen/Qwen2.5-0.5B on a wikitext slice for 30 steps.
#
# The workflow owns the bucket lifecycle: it CREATES a fresh per-run bucket,
# uploads the inlined Axolotl config AND the inlined train.sh to it, and
# mounts it read-WRITE into the job at /workspace/data (so both files are
# visible to the job and the adapter persists into the bucket under output/).
# The uploads mint a short-lived S3 access key from the service account
# (secret -> MysteryBox); no new GitHub secret is needed.
#
# The job's startup script (train.sh) does the whole fine-tune INSIDE the GPU
# container: prefetch the dataset and base model, then run Axolotl. It writes
# the adapter to /workspace/data/output (bucket-backed) and exits — the job
# never talks to a registry, so it needs no registry credential at all.
#
# The deploy job then points a STOCK vLLM image at that same bucket, mounted
# read-only at /adapters, and overrides the entrypoint (via deploy-endpoint's
# `command`/`args`) to serve the base model with the adapter loaded from
# /adapters/output. Nothing is baked or pushed.
#
# Auth: service-account key (NOT OIDC). `setup` configures a key-based CLI
# profile for bucket ops and log streaming (the CLI needs its own
# ~/.nebius/config.yaml). The `auth` action then exports NEBIUS_IAM_TOKEN for
# the SDK job-create path.
#
# Requires:
#   vars.NEBIUS_SERVICE_ACCOUNT_ID  - the SA the key belongs to
#   vars.NEBIUS_PUBLIC_KEY_ID       - the authorized key's public key id
#   secrets.NEBIUS_PRIVATE_KEY      - the authorized key's PEM private key
#   vars.NEBIUS_TENANT_ID           - the tenant (for the CLI profile)
#   vars.NEBIUS_JOB_IMAGE           - Axolotl image (optional; has a default)
#   vars.NEBIUS_PROJECT_ID          - parent project (bucket, job, endpoint)
#   vars.NEBIUS_VLLM_IMAGE          - vLLM serving image (optional; has a default)
name: demo-run-job

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Compute platform'
        default: 'gpu-l40s-a'
      preset:
        description: 'Compute preset'
        default: '1gpu-8vcpu-32gb'
      disk-size:
        description: 'Job disk size'
        default: '250Gi'
      endpoint-preset:
        description: 'Endpoint compute preset'
        default: '1gpu-16vcpu-64gb'
      endpoint-platform:
        description: 'Endpoint compute platform'
        default: 'gpu-l40s-a'
      endpoint-disk-size:
        description: 'Endpoint main-disk size'
        default: '100Gi'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) Provision the bucket, stage the inputs, create the Job. submit-job
  #    returns as soon as the Job is accepted (status CREATING) — it does NOT
  #    wait for the Job to start RUNNING or to complete.
  # ---------------------------------------------------------------------------
  submit:
    name: Submit Training Job
    runs-on: ubuntu-latest
    outputs:
      job-id: ${{ steps.submit.outputs.job-id }}
      bucket-name: ${{ steps.bucket.outputs.bucket-name }}
      bucket-id: ${{ steps.bucket.outputs.bucket-id }}
    steps:
      # Local action refs (./actions/...) only resolve after the repo is checked
      # out into the workspace.
      - uses: actions/checkout@v7

      # Write the Axolotl config inline so this workflow is the single source of
      # truth, then hand the file to upload-object.
      - name: Write Axolotl config
        run: |
          mkdir -p "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/config.yaml" <<'YAML'
          base_model: Qwen/Qwen2.5-0.5B

          load_in_4bit: true
          adapter: qlora

          datasets:
            - path: Salesforce/wikitext
              name: wikitext-2-raw-v1
              split: "train[:2000]"
              type: completion
              field: text

          sequence_len: 128
          micro_batch_size: 1
          gradient_accumulation_steps: 1

          learning_rate: 2e-4
          max_steps: 30
          val_set_size: 0
          logging_steps: 5

          dataset_prepared_path: /tmp/output/last_run_prepared
          output_dir: /workspace/data/output

          lora_r: 8
          lora_alpha: 16
          lora_dropout: 0.05
          lora_target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            - gate_proj
            - up_proj
            - down_proj
          YAML

      # The job's startup script, also inlined here as the single source of
      # truth. It runs INSIDE the Axolotl GPU container: prefetch the dataset
      # and base model, then fine-tune. The adapter lands in the bucket-backed
      # output dir; nothing else happens in the job — no image, no push, no
      # registry credential.
      - name: Write train script
        run: |
          cat > "$RUNNER_TEMP/train.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          # Bound every Hugging Face HTTP call. Left to itself, huggingface_hub
          # waits on a stalled fetch while printing nothing, so a DNS blip hangs
          # the container silently until the Job's own 1h timeout kills it — an
          # hour of GPU time for zero training steps. Disabling the Xet transfer
          # path also shrinks the set of hosts that must resolve to
          # huggingface.co plus its CDN.
          export HF_HUB_ETAG_TIMEOUT="${HF_HUB_ETAG_TIMEOUT:-10}"
          export HF_HUB_DOWNLOAD_TIMEOUT="${HF_HUB_DOWNLOAD_TIMEOUT:-30}"
          export HF_HUB_DISABLE_XET="${HF_HUB_DISABLE_XET:-1}"

          # Retry wrapper for the Hugging Face prefetch. The job container's embedded
          # DNS (127.0.0.11) intermittently fails to resolve external hosts ("server
          # misbehaving"), and huggingface_hub does not budget enough retries to ride
          # out the blip on its own — without this, one transient failure kills a job
          # that is already holding a GPU.
          retry() {
            local n=1 max=6 delay=10
            while true; do
              "$@" && return 0
              if [ "$n" -ge "$max" ]; then
                echo "command still failing after $max attempts: $*" >&2
                return 1
              fi
              echo "attempt $n/$max failed; retrying in ${delay}s: $*" >&2
              n=$((n + 1))
              sleep "$delay"
            done
          }

          # 1) Prefetch the dataset and the base model into the HF cache, so the
          #    job's Hugging Face egress happens once, up front, and loudly. The
          #    timeouts above do NOT cover a hung getaddrinfo, so `timeout` caps
          #    the whole fetch as well, and `retry` gives a transient DNS blip time
          #    to pass rather than killing a job that is already holding a GPU.
          #    Written to a file rather than piped as a heredoc so it can be
          #    rerun without stdin already being at EOF.
          cat > /tmp/prefetch.py <<'PY'
          from huggingface_hub import snapshot_download

          # The card's `configs:` block is what maps the config name onto the
          # parquet files, so it belongs in the cache too. Everything else in the
          # repo is the wikitext-103 splits this demo does not touch.
          snapshot_download(
              "Salesforce/wikitext",
              repo_type="dataset",
              allow_patterns=["wikitext-2-raw-v1/*", "README.md"],
          )
          snapshot_download("Qwen/Qwen2.5-0.5B")
          PY
          retry timeout "${HF_PREFETCH_TIMEOUT:-300}" python /tmp/prefetch.py

          # 2) Fine-tune against that warm cache. The adapter lands in
          #    /workspace/data/output (bucket-backed) — deploy-endpoint mounts
          #    that same bucket read-only and serves straight from there, so
          #    nothing further happens in this job. Bounded as well, so a hang
          #    anywhere in training fails the Job in minutes rather than idling
          #    out the full Job timeout with no output.
          if ! timeout "${TRAIN_TIMEOUT:-1800}" axolotl train /workspace/data/config.yaml; then
            rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "axolotl train made no progress within ${TRAIN_TIMEOUT:-1800}s; killed" >&2
            fi
            exit "$rc"
          fi

          echo "Adapter written to /workspace/data/output"
          SCRIPT

      # Install the CLI and configure a key-based profile so the CLI can
      # authenticate itself (jobs drive the CLI). The private key comes from a
      # secret; setup masks it and writes it to a 0600 file under RUNNER_TEMP.
      - name: Set up Nebius
        uses: ./actions/setup
        with:
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          tenant-id: ${{ vars.NEBIUS_TENANT_ID }}

      # Mint an IAM token for the SDK path (submit-job creates the Job via the
      # SDK, which reads NEBIUS_IAM_TOKEN). Key method — reuses the SA key.
      - name: Authenticate (SDK token)
        uses: ./actions/auth
        with:
          auth-method: key
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}

      # Create a fresh per-run bucket to hold the config and the trained adapters.
      # project-id / service-account-id come from `setup` (exported as
      # NEBIUS_PROJECT_ID / NEBIUS_SERVICE_ACCOUNT_ID), so the resource steps
      # below need not repeat them.
      - name: Create bucket
        id: bucket
        uses: ./actions/create-bucket
        with:
          name: demo-axolotl-${{ github.run_id }}

      # Upload the config to the bucket. Mints a short-lived S3 key from the SA
      # (secret -> MysteryBox) and returns the object URI + mount secret id.
      - name: Upload Axolotl config
        id: upload
        uses: ./actions/upload-object
        with:
          source: ${{ runner.temp }}/config.yaml
          bucket: ${{ steps.bucket.outputs.bucket-name }}
          key: config.yaml

      # The bucket mount doubles as script delivery: this lands at
      # /workspace/data/train.sh inside the job.
      - name: Upload train script
        uses: ./actions/upload-object
        with:
          source: ${{ runner.temp }}/train.sh
          bucket: ${{ steps.bucket.outputs.bucket-name }}
          key: train.sh

      # Create the Job via the SDK. It runs the uploaded train.sh: prefetch,
      # then fine-tune. The Job never talks to a registry, so it gets no
      # registry credential — a security improvement over baking and pushing
      # an image from inside the (billed, GPU) job.
      - name: Submit fine-tune job
        id: submit
        uses: ./actions/submit-job
        with:
          name: demo-axolotl-${{ github.run_id }}
          image: ${{ vars.NEBIUS_JOB_IMAGE || 'docker.io/axolotlai/axolotl:main-20260309-py3.11-cu128-2.9.1' }}
          platform: ${{ inputs.platform }}
          preset: ${{ inputs.preset }}
          # `bash` is the container entrypoint; the actual script is passed as
          # `args` so the container expands the pipeline itself.
          command: bash
          # The Job's own run timeout (passed to the SDK as timeout).
          timeout: 1h
          # Mount the bucket by its id. Nebius resolves the job's access to the
          # bucket from the project/service account — no S3 credentials, profile,
          # or MysteryBox secret are needed on the mount. submit-job parses each
          # `<source>:<path>:<mode>` entry into the SDK volume spec (rw -> READ_WRITE).
          mounts: ${{ steps.bucket.outputs.bucket-id }}:/workspace/data:rw
          disk-size: ${{ inputs.disk-size }}
          preemptible: true
          args: -c "bash /workspace/data/train.sh"

  # ---------------------------------------------------------------------------
  # 2) Poll the Job to a terminal state, streaming logs. Fails on
  #    FAILED/CANCELLED or poll timeout — which skips deploy/try and leaves
  #    teardown to the cleanup job.
  # ---------------------------------------------------------------------------
  wait:
    name: Wait
    runs-on: ubuntu-latest
    needs: submit
    outputs:
      status: ${{ steps.wait.outputs.status }}
      exit-code: ${{ steps.wait.outputs.exit-code }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Nebius
        uses: ./actions/setup
        with:
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          tenant-id: ${{ vars.NEBIUS_TENANT_ID }}

      - name: Authenticate (SDK token)
        uses: ./actions/auth
        with:
          auth-method: key
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}

      # `timeout` here is a poll ceiling in SECONDS (vs the submit `timeout`,
      # which is the Job's own run timeout).
      - name: Wait for fine-tune
        id: wait
        uses: ./actions/wait-for-job
        with:
          job-id: ${{ needs.submit.outputs.job-id }}
          stream-logs: true
          poll-interval: 10
          timeout: 3600

      # The Job outlives this workflow unless we say otherwise: cancelling the
      # run cancels the GitHub job, not the Nebius one. This is the only job
      # that is running while the Nebius Job is, so it is where cancellation
      # has to be forwarded.
      - name: Cancel job on workflow cancellation
        if: cancelled() && needs.submit.outputs.job-id != ''
        uses: ./actions/cancel-job
        with:
          job-id: ${{ needs.submit.outputs.job-id }}

  # ---------------------------------------------------------------------------
  # 3) A successful `wait` means the adapter is sitting in the run bucket
  #    under output/. Deploy a STOCK vLLM image with that bucket mounted
  #    read-only at /adapters and poll to serving. vLLM listens on 8000 and
  #    pulls the 0.5B base model from Hugging Face at startup; the adapter is
  #    loaded from the mount rather than being baked into an image.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [submit, wait]
    outputs:
      endpoint-id: ${{ steps.deploy.outputs.endpoint-id }}
      url: ${{ steps.endpoint.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Nebius
        uses: ./actions/setup
        with:
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          tenant-id: ${{ vars.NEBIUS_TENANT_ID }}

      - name: Authenticate (SDK token)
        uses: ./actions/auth
        with:
          auth-method: key
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}

      # wait: false — the explicit wait step below polls it to serving, so the
      # endpoint id is published even if the endpoint never becomes ready
      # (which is what lets cleanup tear it down).
      - name: Deploy endpoint
        id: deploy
        uses: ./actions/deploy-endpoint
        with:
          name: demo-axolotl-${{ github.run_id }}
          image: ${{ vars.NEBIUS_VLLM_IMAGE || 'docker.io/vllm/vllm-openai:latest' }}
          # The adapters the training job wrote, mounted read-only straight from
          # the run bucket. No image is built: the entrypoint is set here instead
          # of being baked in with crane.
          mounts: ${{ needs.submit.outputs.bucket-id }}:/adapters:ro
          command: vllm
          args: >-
            serve Qwen/Qwen2.5-0.5B --enable-lora --lora-modules
            demo=/adapters/output
          port: 8000
          public: true
          preset: ${{ inputs.endpoint-preset }}
          platform: ${{ inputs.endpoint-platform }}
          disk-size: ${{ inputs.endpoint-disk-size }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          wait: false

      - name: Wait for endpoint
        id: endpoint
        uses: ./actions/wait-for-endpoint
        with:
          endpoint-id: ${{ steps.deploy.outputs.endpoint-id }}
          poll-interval: 10
          timeout: 1800

  # ---------------------------------------------------------------------------
  # 4) Prove the fine-tuned model actually serves: vLLM /health (with retries
  #    while it downloads and loads the base model) plus one completion through
  #    the LoRA adapter ("demo" is the --lora-modules name the deploy step
  #    passes to the vLLM entrypoint via `args`).
  # ---------------------------------------------------------------------------
  try:
    name: Try
    runs-on: ubuntu-latest
    needs: [submit, wait, deploy]
    steps:
      # Values come in through env (not ${{ }} inlined into the script body) so
      # they expand in the shell — the injection-safe pattern.
      - name: Smoke test endpoint
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          curl -fsS --retry 30 --retry-delay 10 --retry-all-errors "$URL/health"
          curl -fsS -X POST "$URL/v1/completions" \
            -H 'Content-Type: application/json' \
            -d '{"model": "demo", "prompt": "The quick brown fox", "max_tokens": 16}'

      - name: Report result
        env:
          JOB_ID: ${{ needs.submit.outputs.job-id }}
          STATUS: ${{ needs.wait.outputs.status }}
          EXIT_CODE: ${{ needs.wait.outputs.exit-code }}
          ENDPOINT_ID: ${{ needs.deploy.outputs.endpoint-id }}
          ENDPOINT_URL: ${{ needs.deploy.outputs.url }}
        run: |
          echo "Job ID:       $JOB_ID"
          echo "Status:       $STATUS"
          echo "Exit code:    $EXIT_CODE"
          echo "Endpoint ID:  $ENDPOINT_ID"
          echo "Endpoint URL: $ENDPOINT_URL"

  # ---------------------------------------------------------------------------
  # 5) Demo hygiene: tear the endpoint and bucket down even on failure or
  #    cancellation, so a paid endpoint never outlives the run. `needs` every
  #    upstream job and `if: always()` so it runs when they fail or are skipped;
  #    each step is guarded on the resource actually having been created.
  # ---------------------------------------------------------------------------
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [submit, wait, deploy, try]
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Set up Nebius
        uses: ./actions/setup
        with:
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          tenant-id: ${{ vars.NEBIUS_TENANT_ID }}

      - name: Authenticate (SDK token)
        uses: ./actions/auth
        with:
          auth-method: key
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}

      # Endpoint before bucket, deliberately: the endpoint mounts the bucket
      # (read-only, at /adapters), so deleting the bucket first would yank
      # storage out from under a still-live endpoint. Keep this step ordered
      # ahead of "Delete bucket" below.
      - name: Delete endpoint
        if: needs.deploy.outputs.endpoint-id != ''
        uses: ./actions/delete-endpoint
        with:
          endpoint-id: ${{ needs.deploy.outputs.endpoint-id }}

      # Must run after "Delete endpoint" above — see the comment there.
      - name: Delete bucket
        if: needs.submit.outputs.bucket-id != ''
        uses: ./actions/delete-bucket
        with:
          bucket: ${{ needs.submit.outputs.bucket-name }}
          bucket-id: ${{ needs.submit.outputs.bucket-id }}
