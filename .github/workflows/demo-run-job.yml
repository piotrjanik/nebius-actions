# Demo: train-to-serve — the split Job path running a real LoRA fine-tune with
# Axolotl on a Nebius GPU; the job ITSELF then bakes the adapters into a vLLM
# image and pushes it to the Nebius Container Registry, and the workflow
# deploys that image and smoke-tests it.
#
# Adapted from the Nebius serverless-ai-cookbook:
#   https://github.com/nebius/serverless-ai-cookbook/tree/main/training/axolotl-finetuning
#
# The pipeline is split across five jobs:
#
#   submit  (Submit Training Job) - provisions the bucket, uploads the config
#                                   and the training script, resolves the
#                                   registry, and CREATES the Job (returns as
#                                   soon as it is accepted; does not wait).
#   wait    (Wait)                - streams the Job's logs and polls it to a
#                                   terminal state; fails if the Job did not
#                                   succeed.
#   deploy  (Deploy)              - deploys the image the Job pushed to an
#                                   Endpoint and polls it to serving.
#   try     (Try)                 - smoke-tests /health and /v1/completions
#                                   through the LoRA adapter, and reports.
#   cleanup (Cleanup)             - tears down the endpoint and the bucket.
#
# Each job runs on a fresh runner, so checkout + `setup` + `auth` are repeated
# in every job that talks to Nebius: the workspace, the installed CLI and the
# minted NEBIUS_IAM_TOKEN do not survive a job boundary. State that must cross
# a boundary (bucket, image ref, job id, endpoint) is published through job
# `outputs`.
#
# Cleanup is its own job with `needs` on all four and `if: always()`, so the
# paid endpoint and the bucket are torn down even when an upstream job fails or
# the run is cancelled. Folding teardown into `try` would leak the endpoint
# whenever `deploy` failed, because `try` would then never run.
#
# It QLoRA-fine-tunes Qwen/Qwen2.5-0.5B on a wikitext-2 slice for 30 steps, then
# bakes the base weights + adapters into a vLLM image and pushes it before exiting.
#
# NOTHING in this pipeline talks to Hugging Face at run time. The weights and the
# corpus come from a durable cache bucket (see seed-model-cache.yml), mounted
# read-only at /workspace/cache; the job bakes the weights into the image it
# pushes, so the endpoint serves `vllm serve /model` and does not download the
# base model at boot either. HF returned 403 on every LFS blob for ~40 minutes on
# 2026-07-13 and hung a run for its full 1h timeout; this is the fix.
#
# Requires (in addition to the vars below): the demo-model-cache bucket, seeded
# once by the seed-model-cache workflow. vars.NEBIUS_MODEL_CACHE_BUCKET overrides
# its name.
#
# The workflow owns the bucket lifecycle: it CREATES a fresh per-run bucket,
# uploads the inlined Axolotl config AND the inlined train-and-push.sh to it,
# and mounts it read-WRITE into the job at /workspace/data (so both files are
# visible to the job and the adapters persist into the bucket under output/).
# The uploads mint a short-lived S3 access key from the service account
# (secret -> MysteryBox); no new GitHub secret is needed.
#
# The job's startup script (train-and-push.sh) does the whole model pipeline
# INSIDE the GPU container: fine-tune with Axolotl, package the base weights
# and adapters into one image layer, and push vllm/vllm-openai:latest + that
# layer to the Nebius Container Registry with crane (daemonless — no docker
# daemon in the job).
# The registry credential is the short-lived NEBIUS_IAM_TOKEN that `auth`
# exported, passed to the job as an env var.
#
# Auth: service-account key (NOT OIDC). `setup` configures a key-based CLI
# profile for bucket ops and log streaming (the CLI needs its own
# ~/.nebius/config.yaml). The `auth` action then exports NEBIUS_IAM_TOKEN for
# the SDK job-create path.
#
# Requires:
#   vars.NEBIUS_SERVICE_ACCOUNT_ID  - the SA the key belongs to
#   vars.NEBIUS_PUBLIC_KEY_ID       - the authorized key's public key id
#   secrets.NEBIUS_PRIVATE_KEY      - the authorized key's PEM private key
#   vars.NEBIUS_TENANT_ID           - the tenant (for the CLI profile)
#   vars.NEBIUS_JOB_IMAGE           - Axolotl image (optional; has a default)
#   vars.NEBIUS_PROJECT_ID          - parent project (used to resolve/create the registry)
#   vars.NEBIUS_REGISTRY_ID         - Container Registry id (optional; the workflow
#                                     resolve-or-creates a registry named
#                                     "demo-qwen-lora-vllm" when unset)
#   vars.NEBIUS_REGISTRY            - registry host (optional; defaults to the
#                                     registry's own regional FQDN, e.g.
#                                     cr.eu-north1.nebius.cloud)
#   vars.NEBIUS_VLLM_IMAGE          - vLLM base image (optional; has a default)
#   vars.NEBIUS_MODEL_CACHE_BUCKET  - model cache bucket name (optional; defaults
#                                     to "demo-model-cache"); the bucket must
#                                     have been seeded once by the
#                                     seed-model-cache workflow before this
#                                     demo runs
name: demo-run-job

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Compute platform'
        default: 'gpu-l40s-a'
      preset:
        description: 'Compute preset'
        default: '1gpu-8vcpu-32gb'
      disk-size:
        description: 'Job disk size'
        default: '250Gi'
      endpoint-preset:
        description: 'Endpoint compute preset'
        default: '1gpu-16vcpu-64gb'
      endpoint-platform:
        description: 'Endpoint compute platform'
        default: 'gpu-l40s-a'
      endpoint-disk-size:
        description: 'Endpoint main-disk size'
        default: '100Gi'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) Provision the bucket, stage the inputs, resolve the registry, create the
  #    Job. submit-job returns as soon as the Job is accepted (status CREATING)
  #    — it does NOT wait for the Job to start RUNNING or to complete.
  # ---------------------------------------------------------------------------
  submit:
    name: Submit Training Job
    runs-on: ubuntu-latest
    outputs:
      job-id: ${{ steps.submit.outputs.job-id }}
      bucket-name: ${{ steps.bucket.outputs.bucket-name }}
      bucket-id: ${{ steps.bucket.outputs.bucket-id }}
      image: ${{ steps.image.outputs.image }}
    steps:
      # Local action refs (./actions/...) only resolve after the repo is checked
      # out into the workspace.
      - uses: actions/checkout@v4

      # Write the Axolotl config inline so this workflow is the single source of
      # truth, then hand the file to upload-object.
      - name: Write Axolotl config
        run: |
          mkdir -p "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/config.yaml" <<'YAML'
          base_model: /workspace/cache/model

          load_in_4bit: true
          adapter: qlora

          datasets:
            - path: /workspace/cache/data/wikitext-2-raw-v1/train-00000-of-00001.parquet
              ds_type: parquet
              type: completion
              field: text

          sequence_len: 128
          micro_batch_size: 1
          gradient_accumulation_steps: 1

          learning_rate: 2e-4
          max_steps: 30
          val_set_size: 0
          logging_steps: 5

          dataset_prepared_path: /tmp/output/last_run_prepared
          output_dir: /workspace/data/output

          lora_r: 8
          lora_alpha: 16
          lora_dropout: 0.05
          lora_target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            - gate_proj
            - up_proj
            - down_proj
          YAML

      # The job's startup script, also inlined here as the single source of
      # truth. It runs INSIDE the Axolotl GPU container: fine-tune, package the
      # adapters as an image layer, and push BASE_IMAGE + that layer to the
      # registry with crane — daemonless, since the job has no docker daemon.
      - name: Write train-and-push script
        run: |
          cat > "$RUNNER_TEMP/train-and-push.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          : "${BASE_IMAGE:?BASE_IMAGE (vLLM base image ref) must be set}"
          : "${IMAGE:?IMAGE (target image ref) must be set}"
          : "${REGISTRY:?REGISTRY (target registry host) must be set}"
          : "${REGISTRY_TOKEN:?REGISTRY_TOKEN (IAM token for the registry) must be set}"

          # Retry wrapper for the registry push. The job container's embedded DNS
          # (127.0.0.11) intermittently fails to resolve the registry ("server
          # misbehaving"), and crane's own retry budget (~3 tries in a few seconds)
          # is too small to ride out the blip — which would throw away a completed
          # fine-tune on the last step.
          retry() {
            local n=1 max=6 delay=10
            while true; do
              "$@" && return 0
              if [ "$n" -ge "$max" ]; then
                echo "command still failing after $max attempts: $*" >&2
                return 1
              fi
              echo "attempt $n/$max failed; retrying in ${delay}s: $*" >&2
              n=$((n + 1))
              sleep "$delay"
            done
          }

          # Both the weights and the corpus come from the read-only cache mount, so
          # this job makes no Hugging Face request at all. Assert that: if some
          # transitive default still reaches for the Hub, fail immediately and by
          # name rather than hanging on a degraded HF (which cost an hour of GPU
          # time on 2026-07-13).
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1

          # 1) Fine-tune from the mounted weights + corpus. Adapters land in
          #    /workspace/data/output (run-bucket-backed). Bounded, so a stall fails
          #    the job in minutes instead of idling out the 1h job timeout.
          if ! timeout "${TRAIN_TIMEOUT:-1800}" axolotl train /workspace/data/config.yaml; then
            rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "axolotl train made no progress within ${TRAIN_TIMEOUT:-1800}s; killed" >&2
            fi
            exit "$rc"
          fi

          # 2) One layer carrying BOTH trees: the base weights at /model and the
          #    adapters at /adapters (dropping intermediate checkpoints — the
          #    endpoint only needs the final adapter_config.json +
          #    adapter_model.safetensors). GNU tar takes repeated -C, so a single
          #    layer means a single append over the flaky DNS. The endpoint image is
          #    then self-contained: vLLM never downloads the base model at boot.
          tar -czf /tmp/serve-layer.tar.gz \
              -C /workspace/cache model \
              -C /workspace/data --transform 's|^output|adapters|' --exclude='output/checkpoint-*' output

          # 3) Install crane (daemonless registry client).
          curl -fsSL --retry 5 --retry-all-errors https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin crane

          # 4) Append that layer to the vLLM base (crane streams the base layers from
          #    docker.io into the target registry), then rewrite the entrypoint to
          #    serve the LOCAL model directory with the LoRA adapter mounted under the
          #    model name "demo". `crane auth login` only writes credentials locally,
          #    so it needs no retry; the network-bound calls do.
          crane auth login "$REGISTRY" -u iam -p "$REGISTRY_TOKEN"
          retry crane append -b "$BASE_IMAGE" -f /tmp/serve-layer.tar.gz -t "$IMAGE"
          retry crane mutate "$IMAGE" -t "$IMAGE" \
            --entrypoint "vllm,serve,/model" \
            --cmd "--enable-lora,--lora-modules,demo=/adapters"

          echo "Pushed $IMAGE"
          SCRIPT

      # Install the CLI and configure a key-based profile so the CLI can
      # authenticate itself (jobs drive the CLI). The private key comes from a
      # secret; setup masks it and writes it to a 0600 file under RUNNER_TEMP.
      - name: Set up Nebius
        uses: ./actions/setup
        with:
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          tenant-id: ${{ vars.NEBIUS_TENANT_ID }}

      # Mint an IAM token for the SDK path (submit-job creates the Job via the
      # SDK, which reads NEBIUS_IAM_TOKEN). Key method — reuses the SA key.
      - name: Authenticate (SDK token)
        uses: ./actions/auth
        with:
          auth-method: key
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}

      # Create a fresh per-run bucket to hold the config and the trained adapters.
      # project-id / service-account-id come from `setup` (exported as
      # NEBIUS_PROJECT_ID / NEBIUS_SERVICE_ACCOUNT_ID), so the resource steps
      # below need not repeat them.
      - name: Create bucket
        id: bucket
        uses: ./actions/create-bucket
        with:
          name: demo-axolotl-${{ github.run_id }}

      # The cache bucket is durable and seeded by seed-model-cache.yml. Unlike the
      # registry, do NOT create it on the fly: a missing bucket is a hard, early
      # error here. This only checks that the bucket RESOLVES, not that it is
      # populated — an empty or partially-seeded cache (seed-model-cache's matrix
      # runs with fail-fast: false, so a run with some failed legs still leaves a
      # bucket that exists) sails through this check and only fails later, deep
      # inside the GPU job. If seed-model-cache went red, re-run it before trusting
      # this demo run.
      - name: Resolve model cache bucket
        id: cache
        env:
          NAME: ${{ vars.NEBIUS_MODEL_CACHE_BUCKET || 'demo-model-cache' }}
          PROJECT_ID: ${{ vars.NEBIUS_PROJECT_ID }}
        run: |
          if ! OUT="$(nebius storage bucket get-by-name --parent-id "$PROJECT_ID" --name "$NAME" --format json 2>/dev/null)"; then
            OUT=""
          fi
          CACHE_ID="$(printf '%s' "$OUT" | jq -r '.metadata.id // empty')"
          if [ -z "$CACHE_ID" ]; then
            echo "::error::model cache bucket '$NAME' not found — run the seed-model-cache workflow once before this demo"
            exit 1
          fi
          echo "Using model cache $NAME ($CACHE_ID)"
          echo "bucket-id=$CACHE_ID" >> "$GITHUB_OUTPUT"

      # Upload the config to the bucket. Mints a short-lived S3 key from the SA
      # (secret -> MysteryBox) and returns the object URI + mount secret id.
      - name: Upload Axolotl config
        id: upload
        uses: ./actions/upload-object
        with:
          source: ${{ runner.temp }}/config.yaml
          bucket: ${{ steps.bucket.outputs.bucket-name }}
          key: config.yaml

      # The bucket mount doubles as script delivery: this lands at
      # /workspace/data/train-and-push.sh inside the job.
      - name: Upload train-and-push script
        uses: ./actions/upload-object
        with:
          source: ${{ runner.temp }}/train-and-push.sh
          bucket: ${{ steps.bucket.outputs.bucket-name }}
          key: train-and-push.sh

      # Resolve the target Container Registry, then compute the image ref once;
      # the job pushes that ref and the endpoint serves it. If
      # vars.NEBIUS_REGISTRY_ID is set it is used verbatim; otherwise the
      # workflow resolve-or-creates a durable registry named
      # "demo-qwen-lora-vllm" in the project (like it self-provisions the
      # bucket), so no manual registry setup is needed. `setup` configured the
      # CLI profile the `nebius` calls below authenticate with.
      #
      # The registry HOST is read from the resource's status.registry_fqdn
      # (e.g. cr.eu-north1.nebius.cloud) rather than a fixed default: the
      # regional FQDN is what resolves from INSIDE Nebius compute, where the
      # job pushes and the endpoint pulls. The public "cr.nebius.io" alias does
      # NOT resolve from a Job's network. vars.NEBIUS_REGISTRY still overrides
      # for the rare case you need a specific host.
      - name: Compute image ref
        id: image
        env:
          REGISTRY_OVERRIDE: ${{ vars.NEBIUS_REGISTRY }}
          REGISTRY_ID: ${{ vars.NEBIUS_REGISTRY_ID }}
          REGISTRY_NAME: demo-qwen-lora-vllm
          PROJECT_ID: ${{ vars.NEBIUS_PROJECT_ID }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$REGISTRY_ID" ]; then
            if [ -z "$PROJECT_ID" ]; then
              echo "::error::vars.NEBIUS_PROJECT_ID is required to resolve or create the container registry"
              exit 1
            fi
            echo "Resolving container registry '$REGISTRY_NAME' in $PROJECT_ID"
            REGISTRY_ID="$(nebius registry list --parent-id "$PROJECT_ID" --format json \
              | jq -r --arg name "$REGISTRY_NAME" '[.items[]? | select(.metadata.name == $name) | .metadata.id] | first // empty')"
            if [ -z "$REGISTRY_ID" ]; then
              echo "No registry named '$REGISTRY_NAME' found; creating one"
              REGISTRY_ID="$(nebius registry create --parent-id "$PROJECT_ID" --name "$REGISTRY_NAME" --format json \
                | jq -r '.metadata.id // empty')"
            fi
          fi
          if [ -z "$REGISTRY_ID" ]; then
            echo "::error::failed to resolve or create a container registry"
            exit 1
          fi
          # Host: explicit override wins; otherwise the registry's own regional
          # FQDN (the only host reachable from inside Nebius compute).
          REGISTRY="$REGISTRY_OVERRIDE"
          if [ -z "$REGISTRY" ]; then
            REGISTRY="$(nebius registry get --id "$REGISTRY_ID" --format json \
              | jq -r '.status.registry_fqdn // empty')"
          fi
          if [ -z "$REGISTRY" ]; then
            echo "::error::could not determine the registry FQDN for $REGISTRY_ID (set vars.NEBIUS_REGISTRY to override)"
            exit 1
          fi
          # Nebius data-plane image paths identify the registry by its id with
          # the "registry-" prefix STRIPPED:
          #   cr.<region>.nebius.cloud/<bare-id>/<repo>:<tag>
          # Pushing to the full "registry-..." id fails with
          # "Entity Registry not found by id registry-...".
          REGISTRY_PATH_ID="${REGISTRY_ID#registry-}"
          echo "Using registry $REGISTRY (id $REGISTRY_ID, path $REGISTRY_PATH_ID)"
          {
            echo "registry=$REGISTRY"
            echo "registry-id=$REGISTRY_ID"
            echo "image=$REGISTRY/$REGISTRY_PATH_ID/demo-qwen-lora-vllm:$RUN_ID"
          } >> "$GITHUB_OUTPUT"

      # Create the Job via the SDK. It runs the uploaded train-and-push.sh:
      # fine-tune, then bake + push the vLLM image. REGISTRY_TOKEN is the
      # short-lived IAM token `auth` exported — the job uses it as the crane
      # push credential.
      - name: Submit fine-tune + image push
        id: submit
        uses: ./actions/submit-job
        with:
          name: demo-axolotl-${{ github.run_id }}
          image: ${{ vars.NEBIUS_JOB_IMAGE || 'docker.io/axolotlai/axolotl:main-20260309-py3.11-cu128-2.9.1' }}
          platform: ${{ inputs.platform }}
          preset: ${{ inputs.preset }}
          # `bash` is the container entrypoint; the actual script is passed as
          # `args` so the container expands the pipeline itself.
          command: bash
          # The Job's own run timeout (passed to the SDK as timeout).
          timeout: 1h
          env: |
            BASE_IMAGE=${{ vars.NEBIUS_VLLM_IMAGE || 'docker.io/vllm/vllm-openai:latest' }}
            IMAGE=${{ steps.image.outputs.image }}
            REGISTRY=${{ steps.image.outputs.registry }}
            REGISTRY_TOKEN=${{ env.NEBIUS_IAM_TOKEN }}
          # Mount the bucket(s) by id. Nebius resolves the job's access from the
          # project/service account — no S3 credentials, profile, or MysteryBox
          # secret are needed on the mount. submit-job parses each `<source>:<path>:<mode>`
          # line into the SDK volume spec (rw -> READ_WRITE, ro -> READ_ONLY).
          mounts: |
            ${{ steps.bucket.outputs.bucket-id }}:/workspace/data:rw
            ${{ steps.cache.outputs.bucket-id }}:/workspace/cache:ro
          disk-size: ${{ inputs.disk-size }}
          preemptible: true
          args: -c "bash /workspace/data/train-and-push.sh"

  # ---------------------------------------------------------------------------
  # 2) Poll the Job to a terminal state, streaming logs. Fails on
  #    FAILED/CANCELLED or poll timeout — which skips deploy/try and leaves
  #    teardown to the cleanup job.
  # ---------------------------------------------------------------------------
  wait:
    name: Wait
    runs-on: ubuntu-latest
    needs: submit
    outputs:
      status: ${{ steps.wait.outputs.status }}
      exit-code: ${{ steps.wait.outputs.exit-code }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nebius
        uses: ./actions/setup
        with:
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          tenant-id: ${{ vars.NEBIUS_TENANT_ID }}

      - name: Authenticate (SDK token)
        uses: ./actions/auth
        with:
          auth-method: key
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}

      # `timeout` here is a poll ceiling in SECONDS (vs the submit `timeout`,
      # which is the Job's own run timeout).
      - name: Wait for fine-tune + image push
        id: wait
        uses: ./actions/wait-for-job
        with:
          job-id: ${{ needs.submit.outputs.job-id }}
          stream-logs: true
          poll-interval: 10
          timeout: 3600

      # The Job outlives this workflow unless we say otherwise: cancelling the
      # run cancels the GitHub job, not the Nebius one. This is the only job
      # that is running while the Nebius Job is, so it is where cancellation
      # has to be forwarded.
      - name: Cancel job on workflow cancellation
        if: cancelled() && needs.submit.outputs.job-id != ''
        uses: ./actions/cancel-job
        with:
          job-id: ${{ needs.submit.outputs.job-id }}

  # ---------------------------------------------------------------------------
  # 3) The job pushed the vLLM image as its last step, so a successful `wait`
  #    means the image exists in the registry. Deploy it and poll to serving.
  #    vLLM listens on 8000 and serves the self-contained image: the base
  #    weights are baked in at /model and the LoRA adapter at /adapters, so
  #    there is no model download at boot.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [submit, wait]
    outputs:
      endpoint-id: ${{ steps.deploy.outputs.endpoint-id }}
      url: ${{ steps.endpoint.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nebius
        uses: ./actions/setup
        with:
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          tenant-id: ${{ vars.NEBIUS_TENANT_ID }}

      - name: Authenticate (SDK token)
        uses: ./actions/auth
        with:
          auth-method: key
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}

      # wait: false — the explicit wait step below polls it to serving, so the
      # endpoint id is published even if the endpoint never becomes ready
      # (which is what lets cleanup tear it down).
      - name: Deploy endpoint
        id: deploy
        uses: ./actions/deploy-endpoint
        with:
          name: demo-axolotl-${{ github.run_id }}
          image: ${{ needs.submit.outputs.image }}
          port: 8000
          public: true
          preset: ${{ inputs.endpoint-preset }}
          platform: ${{ inputs.endpoint-platform }}
          disk-size: ${{ inputs.endpoint-disk-size }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          wait: false

      - name: Wait for endpoint
        id: endpoint
        uses: ./actions/wait-for-endpoint
        with:
          endpoint-id: ${{ steps.deploy.outputs.endpoint-id }}
          poll-interval: 10
          timeout: 1800

  # ---------------------------------------------------------------------------
  # 4) Prove the fine-tuned model actually serves: vLLM /health (with retries
  #    while it loads the base model) plus one completion through the LoRA
  #    adapter ("demo" is the --lora-modules name the train-and-push script
  #    baked into the image entrypoint).
  # ---------------------------------------------------------------------------
  try:
    name: Try
    runs-on: ubuntu-latest
    needs: [submit, wait, deploy]
    steps:
      # Values come in through env (not ${{ }} inlined into the script body) so
      # they expand in the shell — the injection-safe pattern.
      - name: Smoke test endpoint
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          curl -fsS --retry 30 --retry-delay 10 --retry-all-errors "$URL/health"
          curl -fsS -X POST "$URL/v1/completions" \
            -H 'Content-Type: application/json' \
            -d '{"model": "demo", "prompt": "The quick brown fox", "max_tokens": 16}'

      - name: Report result
        env:
          JOB_ID: ${{ needs.submit.outputs.job-id }}
          STATUS: ${{ needs.wait.outputs.status }}
          EXIT_CODE: ${{ needs.wait.outputs.exit-code }}
          IMAGE: ${{ needs.submit.outputs.image }}
          ENDPOINT_ID: ${{ needs.deploy.outputs.endpoint-id }}
          ENDPOINT_URL: ${{ needs.deploy.outputs.url }}
        run: |
          echo "Job ID:       $JOB_ID"
          echo "Status:       $STATUS"
          echo "Exit code:    $EXIT_CODE"
          echo "Image:        $IMAGE"
          echo "Endpoint ID:  $ENDPOINT_ID"
          echo "Endpoint URL: $ENDPOINT_URL"

  # ---------------------------------------------------------------------------
  # 5) Demo hygiene: tear the endpoint and bucket down even on failure or
  #    cancellation, so a paid endpoint never outlives the run. `needs` every
  #    upstream job and `if: always()` so it runs when they fail or are skipped;
  #    each step is guarded on the resource actually having been created. (The
  #    pushed image stays in the registry, tagged with the run id.)
  # ---------------------------------------------------------------------------
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [submit, wait, deploy, try]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nebius
        uses: ./actions/setup
        with:
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          tenant-id: ${{ vars.NEBIUS_TENANT_ID }}

      - name: Authenticate (SDK token)
        uses: ./actions/auth
        with:
          auth-method: key
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}

      - name: Delete endpoint
        if: needs.deploy.outputs.endpoint-id != ''
        uses: ./actions/delete-endpoint
        with:
          endpoint-id: ${{ needs.deploy.outputs.endpoint-id }}

      - name: Delete bucket
        if: needs.submit.outputs.bucket-id != ''
        uses: ./actions/delete-bucket
        with:
          bucket: ${{ needs.submit.outputs.bucket-name }}
          bucket-id: ${{ needs.submit.outputs.bucket-id }}
