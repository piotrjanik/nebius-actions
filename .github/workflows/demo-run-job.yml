# Demo: train-to-serve — the split Job path (setup -> submit-job ->
# wait-for-job) running a real LoRA fine-tune with Axolotl on a Nebius GPU,
# then download-object -> docker build/push -> deploy-endpoint ->
# wait-for-endpoint to serve the freshly trained model.
#
# Adapted from the Nebius serverless-ai-cookbook:
#   https://github.com/nebius/serverless-ai-cookbook/tree/main/training/axolotl-finetuning
#
# It QLoRA-fine-tunes Qwen/Qwen2.5-0.5B on a wikitext slice for 30 steps, then
# exits. `submit-job` creates the Job and returns; `wait-for-job` streams its
# logs, polls to a terminal state, and fails the step if the Job did not
# succeed. (The all-in-one `run-job` action fuses these two into one step.)
#
# This workflow owns the bucket lifecycle: it CREATES a fresh per-run bucket,
# uploads the inlined Axolotl config to it, mounts it read-WRITE into the job at
# /workspace/data (so adapters persist into the bucket under output/), and
# trains. The upload mints a short-lived S3 access key from the service account
# (secret -> MysteryBox); no new GitHub secret is needed.
#
# After training it takes the model to production: DOWNLOADS the adapters from
# the bucket (download-object fails when output/ is empty, so it doubles as the
# artifact check), BUILDS them into a CPU serving image
# (examples/qwen-lora-server), PUSHES it to the Nebius Container Registry
# (docker login with the NEBIUS_IAM_TOKEN that `auth` exported), DEPLOYS it to
# an Endpoint (deploy-endpoint -> wait-for-endpoint), smoke-tests /health and
# /generate, and DELETES the endpoint and bucket on cleanup (always, even on
# failure).
#
# Auth: service-account key (NOT OIDC). `setup` configures a key-based CLI
# profile for bucket ops and log streaming (the CLI needs its own
# ~/.nebius/config.yaml). The `auth` action then exports NEBIUS_IAM_TOKEN for
# the SDK job-create path.
#
# Requires:
#   vars.NEBIUS_SERVICE_ACCOUNT_ID  - the SA the key belongs to
#   vars.NEBIUS_PUBLIC_KEY_ID       - the authorized key's public key id
#   secrets.NEBIUS_PRIVATE_KEY      - the authorized key's PEM private key
#   vars.NEBIUS_TENANT_ID           - the tenant (for the CLI profile)
#   vars.NEBIUS_JOB_IMAGE           - Axolotl image (optional; has a default)
#   vars.NEBIUS_PROJECT_ID          - parent project (optional; CLI default used if unset)
#   vars.NEBIUS_REGISTRY_ID         - Container Registry id (image path namespace)
#   vars.NEBIUS_REGISTRY            - registry host (optional; default cr.nebius.io)
name: demo-run-job

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Compute platform'
        default: 'gpu-l40s-a'
      preset:
        description: 'Compute preset'
        default: '1gpu-8vcpu-32gb'
      disk-size:
        description: 'Job disk size'
        default: '250Gi'
      endpoint-preset:
        description: 'Endpoint compute preset'
        default: '1gpu-16vcpu-200gb'

permissions:
  contents: read

jobs:
  run-job:
    runs-on: ubuntu-latest
    steps:
      # Local action refs (./actions/...) only resolve after the repo is checked
      # out into the workspace.
      - uses: actions/checkout@v4

      # Write the Axolotl config inline so this workflow is the single source of
      # truth, then hand the file to upload-object.
      - name: Write Axolotl config
        run: |
          mkdir -p "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/config.yaml" <<'YAML'
          base_model: Qwen/Qwen2.5-0.5B

          load_in_4bit: true
          adapter: qlora

          datasets:
            - path: Salesforce/wikitext
              name: wikitext-2-raw-v1
              split: "train[:2000]"
              type: completion
              field: text

          sequence_len: 128
          micro_batch_size: 1
          gradient_accumulation_steps: 1

          learning_rate: 2e-4
          max_steps: 30
          val_set_size: 0
          logging_steps: 5

          dataset_prepared_path: /tmp/output/last_run_prepared
          output_dir: /workspace/data/output

          lora_r: 8
          lora_alpha: 16
          lora_dropout: 0.05
          lora_target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            - gate_proj
            - up_proj
            - down_proj
          YAML

      # Install the CLI and configure a key-based profile so the CLI can
      # authenticate itself (jobs drive the CLI). The private key comes from a
      # secret; setup masks it and writes it to a 0600 file under RUNNER_TEMP.
      - name: Set up Nebius
        uses: ./actions/setup
        with:
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          project-id: ${{ vars.NEBIUS_PROJECT_ID }}
          tenant-id: ${{ vars.NEBIUS_TENANT_ID }}

      # Mint an IAM token for the SDK path (submit-job creates the Job via the
      # SDK, which reads NEBIUS_IAM_TOKEN). Key method — reuses the SA key.
      - name: Authenticate (SDK token)
        uses: ./actions/auth
        with:
          auth-method: key
          service-account-id: ${{ vars.NEBIUS_SERVICE_ACCOUNT_ID }}
          public-key-id: ${{ vars.NEBIUS_PUBLIC_KEY_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}

      # Create a fresh per-run bucket to hold the config and the trained adapters.
      # project-id / service-account-id come from `setup` (exported as
      # NEBIUS_PROJECT_ID / NEBIUS_SERVICE_ACCOUNT_ID), so the resource steps
      # below need not repeat them.
      - name: Create bucket
        id: bucket
        uses: ./actions/create-bucket
        with:
          name: demo-axolotl-${{ github.run_id }}

      # Upload the config to the bucket. Mints a short-lived S3 key from the SA
      # (secret -> MysteryBox) and returns the object URI + mount secret id.
      - name: Upload Axolotl config
        id: upload
        uses: ./actions/upload-object
        with:
          source: ${{ runner.temp }}/config.yaml
          bucket: ${{ steps.bucket.outputs.bucket-name }}
          key: config.yaml

      # 1) Create the Job via the SDK. submit-job returns as soon as the Job is
      #    accepted (status CREATING), emitting its id — it does NOT wait for the
      #    Job to start RUNNING or to complete.
      - name: Submit Axolotl fine-tune
        id: submit
        uses: ./actions/submit-job
        with:
          name: demo-axolotl-${{ github.run_id }}
          image: ${{ vars.NEBIUS_JOB_IMAGE || 'docker.io/axolotlai/axolotl:main-20260309-py3.11-cu128-2.9.1' }}
          platform: ${{ inputs.platform }}
          preset: ${{ inputs.preset }}
          # `bash` is the container entrypoint; the actual script is passed as
          # `args` so the container expands the pipeline itself.
          command: bash
          # The Job's own run timeout (passed to the SDK as timeout).
          timeout: 1h
          # Mount the bucket by its id. Nebius resolves the job's access to the
          # bucket from the project/service account — no S3 credentials, profile,
          # or MysteryBox secret are needed on the mount. submit-job parses each
          # `<source>:<path>:<mode>` entry into the SDK volume spec (rw -> READ_WRITE).
          mounts: ${{ steps.bucket.outputs.bucket-id }}:/workspace/data:rw
          disk-size: ${{ inputs.disk-size }}
          preemptible: true
          args: -c "axolotl train /workspace/data/config.yaml"

      # 2) With the Job created, poll its status to a terminal state,
      #    streaming logs. Fails the step on FAILED/CANCELLED or poll timeout.
      #    `timeout` here is a poll ceiling in SECONDS (vs the submit `timeout`
      #    above, which is the Job's own run timeout).
      - name: Wait for fine-tune
        id: wait
        uses: ./actions/wait-for-job
        with:
          job-id: ${{ steps.submit.outputs.job-id }}
          stream-logs: true
          poll-interval: 10
          timeout: 3600

      # Pull the trained adapters out of the bucket onto the runner.
      # download-object fails when output/ is empty, so it also VERIFIES the
      # fine-tune actually produced artifacts (subsumes check-object here).
      - name: Download model artifacts
        id: download
        uses: ./actions/download-object
        with:
          bucket: ${{ steps.bucket.outputs.bucket-name }}
          prefix: output/
          dest: ${{ runner.temp }}/adapters

      # Bake the adapters into the CPU serving image. The Dockerfile expects
      # them under ./adapters inside the build context and snapshots the base
      # model at build time, so the pushed image is hermetic.
      - name: Build serving image
        id: image
        env:
          REGISTRY: ${{ vars.NEBIUS_REGISTRY || 'cr.nebius.io' }}
          REGISTRY_ID: ${{ vars.NEBIUS_REGISTRY_ID }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$REGISTRY_ID" ]; then
            echo "::error::vars.NEBIUS_REGISTRY_ID is required to push the serving image"
            exit 1
          fi
          IMAGE="$REGISTRY/$REGISTRY_ID/demo-qwen-lora:$RUN_ID"
          cp -R "$RUNNER_TEMP/adapters" examples/qwen-lora-server/adapters
          docker build -t "$IMAGE" examples/qwen-lora-server
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # The registry accepts `iam` + an IAM token as docker credentials; the
      # `auth` step above already exported NEBIUS_IAM_TOKEN for this job.
      - name: Push serving image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY: ${{ vars.NEBIUS_REGISTRY || 'cr.nebius.io' }}
        run: |
          echo "$NEBIUS_IAM_TOKEN" | docker login "$REGISTRY" -u iam --password-stdin
          docker push "$IMAGE"

      # Deploy the pushed image to an Endpoint and return immediately
      # (wait: false); the explicit wait step below polls it to serving.
      - name: Deploy endpoint
        id: deploy
        uses: ./actions/deploy-endpoint
        with:
          name: demo-axolotl-${{ github.run_id }}
          image: ${{ steps.image.outputs.image }}
          port: 8080
          public: true
          preset: ${{ inputs.endpoint-preset }}
          wait: false

      - name: Wait for endpoint
        id: endpoint
        uses: ./actions/wait-for-endpoint
        with:
          endpoint-id: ${{ steps.deploy.outputs.endpoint-id }}
          poll-interval: 10
          timeout: 30m

      # Prove the fine-tuned model actually serves: health probe (with retries
      # while the container finishes loading the model) plus one greedy
      # generation through the LoRA-patched model.
      - name: Smoke test endpoint
        env:
          URL: ${{ steps.endpoint.outputs.url }}
        run: |
          curl -fsS --retry 18 --retry-delay 10 --retry-all-errors "$URL/health"
          curl -fsS -X POST "$URL/generate" \
            -H 'Content-Type: application/json' \
            -d '{"prompt": "The quick brown fox", "max_new_tokens": 16}'

      # 3) If the run is cancelled, cancel the Nebius Job too.
      - name: Cancel job on workflow cancellation
        if: cancelled() && steps.submit.outputs.job-id != ''
        uses: ./actions/cancel-job
        with:
          job-id: ${{ steps.submit.outputs.job-id }}

      # Demo hygiene: tear the endpoint down even on failure so a paid
      # endpoint never outlives the run. (The pushed image stays in the
      # registry, tagged with the run id.)
      - name: Delete endpoint
        if: always() && steps.deploy.outputs.endpoint-id != ''
        uses: ./actions/delete-endpoint
        with:
          endpoint-id: ${{ steps.deploy.outputs.endpoint-id }}

      # Clean up: empty + delete the bucket. Runs even on failure/cancellation,
      # but only if the bucket was actually created.
      - name: Delete bucket
        if: always() && steps.bucket.outputs.bucket-id != ''
        uses: ./actions/delete-bucket
        with:
          bucket: ${{ steps.bucket.outputs.bucket-name }}
          bucket-id: ${{ steps.bucket.outputs.bucket-id }}

      # Read step outputs via env (not ${{ }} inlined into the script body) so
      # values expand in the shell — the injection-safe pattern.
      - name: Report result
        env:
          JOB_ID: ${{ steps.submit.outputs.job-id }}
          STATUS: ${{ steps.wait.outputs.status }}
          EXIT_CODE: ${{ steps.wait.outputs.exit-code }}
          IMAGE: ${{ steps.image.outputs.image }}
          ENDPOINT_ID: ${{ steps.deploy.outputs.endpoint-id }}
          ENDPOINT_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          echo "Job ID:       $JOB_ID"
          echo "Status:       $STATUS"
          echo "Exit code:    $EXIT_CODE"
          echo "Image:        $IMAGE"
          echo "Endpoint ID:  $ENDPOINT_ID"
          echo "Endpoint URL: $ENDPOINT_URL"
