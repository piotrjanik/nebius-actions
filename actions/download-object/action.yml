name: 'Nebius Download Object'
description: >-
  Download every object under a bucket prefix to a local directory using a
  short-lived access key minted from the configured service account. Fails when
  the prefix matches nothing.
author: 'Nebius Actions'
branding:
  icon: 'download-cloud'
  color: 'blue'

inputs:
  bucket:
    description: 'Source bucket name (required).'
    required: true
  prefix:
    description: 'Object key prefix to download (required).'
    required: true
  dest:
    description: 'Local directory on the runner to write objects into (required).'
    required: true
  service-account-id:
    description: >-
      Service account to mint the ephemeral access key for. Optional when the
      `setup` action ran earlier with a service-account-id — setup exports
      NEBIUS_SERVICE_ACCOUNT_ID for later steps, which this action falls back to.
      Set it here to override.
    required: false
  project-id:
    description: >-
      Parent project for the access key. Optional when the `setup` action ran
      earlier with a project-id — setup exports NEBIUS_PROJECT_ID for later
      steps, which this action falls back to. Set it here to override.
    required: false
  expires-in:
    description: 'Ephemeral key TTL (e.g. 2h, 30m).'
    required: false
    default: '2h'
  endpoint:
    description: 'S3 endpoint for Nebius Object Storage.'
    required: false
    default: 'https://storage.eu-north1.nebius.cloud'
  region:
    description: 'S3 region.'
    required: false
    default: 'eu-north1'

outputs:
  files-count:
    description: 'Number of objects downloaded (>= 1 on success).'
  dest:
    description: 'The destination directory the objects were written to.'

runs:
  using: 'node24'
  main: 'dist/index.js'
