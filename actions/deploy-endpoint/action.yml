name: 'Nebius Deploy Endpoint'
description: >-
  Create a Nebius Endpoint (via the Nebius SDK) and poll until it is serving.
  Note: the API has no update verb — if an endpoint with the same name already
  exists it is returned as-is and NOT updated.
author: 'Nebius Actions'
branding:
  icon: 'globe'
  color: 'blue'

inputs:
  name:
    description: 'Endpoint name (required).'
    required: true
  image:
    description: 'Container image to serve (required).'
    required: true
  port:
    description: 'Container port the served process listens on.'
    required: false
  public:
    description: 'Assign a public IP / expose a public URL.'
    required: false
    default: 'false'
  token:
    description: >-
      Bearer token required to access the served endpoint (set as the endpoint
      authToken). Registered as a secret and masked; never echoed as an output.
    required: false
  preset:
    description: 'Compute preset (e.g. 1gpu-16vcpu-200gb).'
    required: false
  platform:
    description: 'Compute platform.'
    required: false
  disk-size:
    description: 'Main-disk size for the endpoint (e.g. 100Gi). Required by the API.'
    required: false
  disk-type:
    description: >-
      Main-disk type: network-ssd (default), network-hdd,
      network-ssd-non-replicated, or network-ssd-io-m3.
    required: false
  subnet-id:
    description: >-
      Subnet id to deploy into. When unset, the project's first subnet is
      resolved automatically (needs project-id).
    required: false
  protocol:
    description: 'Served port protocol: HTTP (default), TCP, or UDP.'
    required: false
  env:
    description: 'Environment variables as multiline KEY=VALUE pairs.'
    required: false
  mounts:
    description: >-
      Bucket mounts, one per line, as `<bucket-id>:/container/path[:rw|ro]`
      (default rw). Mounted by bucket id — no S3 credentials are needed.
    required: false
  command:
    description: 'Entrypoint override for the container (e.g. `vllm`).'
    required: false
  args:
    description: >-
      Args passed to the entrypoint (e.g. `serve /model --enable-lora`). Lets a
      stock image be configured at deploy time instead of rebuilt.
    required: false
  wait:
    description: 'Wait until the endpoint is serving.'
    required: false
    default: 'true'
  timeout:
    description: 'Maximum seconds to poll before failing.'
    required: false
    default: '3600'
  poll-interval:
    description: 'Seconds between status polls.'
    required: false
    default: '10'
  project-id:
    description: 'Nebius project id (the endpoint parent).'
    required: false

outputs:
  endpoint-id:
    description: 'The endpoint id.'
  url:
    description: 'The public HTTPS URL (when reported).'
  status:
    description: 'The final endpoint status.'

runs:
  using: 'node24'
  main: 'dist/index.js'
