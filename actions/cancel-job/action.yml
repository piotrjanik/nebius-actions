name: 'Nebius Cancel Job'
description: >-
  Cancel a running Nebius Job. Authenticates via the SDK — run the `auth`
  action first (exports NEBIUS_IAM_TOKEN).
author: 'Nebius Actions'
branding:
  icon: 'x-circle'
  color: 'blue'

inputs:
  job-id:
    description: 'The job id to cancel (required).'
    required: true

outputs:
  status:
    description: 'The job status after cancellation.'

runs:
  using: 'node24'
  main: 'dist/index.js'
